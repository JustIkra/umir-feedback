services:
  feedback:
    environment:
      FEEDBACK_OTP_ENABLED: "true"
      FEEDBACK_SERVICE_TOKEN_FILE: /run/secrets/feedback-service-token
      FEEDBACK_OTP_PEPPER_FILE: /run/secrets/otp-pepper
      FEEDBACK_OTP_ENCRYPTION_KEY_FILE: /run/secrets/otp-encryption-key
    secrets:
      - source: feedback-service-token
        target: feedback-service-token
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: otp-pepper
        target: otp-pepper
        uid: "65532"
        gid: "65532"
        mode: 0400
      - source: otp-encryption-key
        target: otp-encryption-key
        uid: "65532"
        gid: "65532"
        mode: 0400

secrets:
  feedback-service-token:
    file: ${FEEDBACK_SERVICE_TOKEN_FILE:?set the closed external shared service token file}
  otp-pepper:
    file: ${FEEDBACK_OTP_PEPPER_FILE:?set the closed external OTP pepper file}
  otp-encryption-key:
    file: ${FEEDBACK_OTP_ENCRYPTION_KEY_FILE:?set the closed external OTP encryption key file}
