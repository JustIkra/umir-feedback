name: Check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned Go quality tools
        run: make tools
      - name: Test quality enforcement
        run: make quality-test
      - name: Check Go quality
        run: make check
  containers:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Validate synthetic VPN configuration with the pinned core
        run: docker buildx build --target config-check -f Dockerfile.vpn .
      - name: Build application image
        run: docker buildx build --load --build-arg VCS_REF="$GITHUB_SHA" --tag umir-feedback-ci:server -f Dockerfile .
      - name: Build VPN image
        run: docker buildx build --load --build-arg VCS_REF="$GITHUB_SHA" --tag umir-feedback-ci:vpn -f Dockerfile.vpn .
      - name: Test private runtime with synthetic configuration
        run: bash tests/container/feedback-smoke.sh umir-feedback-ci:server umir-feedback-ci:vpn
